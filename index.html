<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11382e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Golf Passport">
    <title>Golf Passport Europe</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="styles.css?v=18">
  </head>
  <body>
    <main class="app-shell">
      <section class="map-panel" aria-label="Golfplatzkarte">
        <div id="leafletMap" class="leaflet-map" role="application" aria-label="Interaktive OpenStreetMap-Karte von Europa"></div>

        <header class="top-bar">
          <div class="title-plate">
            <p class="eyebrow">Golf Passport Europe</p>
            <h1>Deine gespielten Plätze</h1>
          </div>
          <button class="icon-button" id="accountButton" type="button" aria-label="Lokales Profil aktivieren">
            <span class="profile-dot">P</span>
          </button>
        </header>

        <div class="search-card">
          <label class="search-field">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="courseSearch" type="search" placeholder="Golfplatz, Land oder Region suchen">
          </label>
          <button class="nearby-button" id="nearbyButton" type="button">GPS</button>
        </div>

        <nav class="mode-switch" aria-label="Ansicht">
          <button class="mode-button active" data-view="map" type="button">Karte</button>
          <button class="mode-button" data-view="album" type="button">Album</button>
          <button class="mode-button" data-view="nearby" type="button">Nähe</button>
        </nav>
      </section>

      <button class="album-backdrop" id="albumBackdrop" type="button" aria-label="Album schliessen"></button>
      <aside class="album-panel" id="albumPanel" aria-label="Stickeralbum">
        <div class="album-header">
          <div>
            <p class="eyebrow">Stickeralbum</p>
            <h2 id="albumTitle">0 Plätze angepinnt</h2>
          </div>
          <div class="completion-ring" aria-label="Fortschritt">
            <span id="completionValue">0%</span>
          </div>
        </div>
        <div class="stat-row">
          <div>
            <strong id="visitedCount">0</strong>
            <span>besucht</span>
          </div>
          <button class="country-stat" id="countryStat" type="button" aria-label="Besuchte Laender anzeigen">
            <strong id="countryCount">0</strong>
            <span>Länder</span>
          </button>
          <div>
            <strong id="nearbyCount">0</strong>
            <span>in der Nähe</span>
          </div>
        </div>
        <div class="sticker-grid" id="stickerGrid"></div>
      </aside>

      <section class="sheet" id="detailSheet" aria-live="polite">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div id="sheetContent" class="sheet-content"></div>
      </section>

      <section class="country-modal" id="countryModal" aria-modal="true" aria-label="Besuchte Laender" role="dialog" hidden>
        <div class="country-card">
          <button class="sheet-close" id="closeCountryModal" type="button" aria-label="Laenderkarte schliessen">×</button>
          <p class="eyebrow">Laenderkarte</p>
          <h2>Deine Golf-Reisen</h2>
          <div class="country-map">
            <img src="assets/europe-countries.svg" alt="Schematische Europakarte mit Laendergrenzen">
            <div id="countryFlagLayer" class="country-flag-layer"></div>
          </div>
          <p class="country-note" id="countryNote">Noch keine Laender angepinnt.</p>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app-config.js?v=18"></script>
    <script src="app.js?v=18"></script>
  </body>
</html>
